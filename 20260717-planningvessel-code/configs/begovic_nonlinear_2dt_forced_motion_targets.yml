required_before_run:
  - Verify every derived value satisfies the cited Savitsky equations to numerical tolerance.
  - Run a predeclared wetted-geometry sensitivity band for Fn_B=1.67 because it is below the stated Cv > 2 applicability range.
  - Keep the Savitsky-derived wetted geometry labelled as model input, not as measured Begovic data.
  - Freeze every completed target input and source hash before forced-motion calculation.

acceptance_constraints:
  response_calibration_used: false
  complete_matrix_replacement_only: true
  frequency_extrapolation_allowed: false
  required_coefficients: [A33, B33, A35, B35, A53, B53, A55, B55]
  maximum_harmonic_fit_residual: 0.05
  maximum_grid_change: 0.05
